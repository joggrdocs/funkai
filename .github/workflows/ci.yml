name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Check for changeset
        run: pnpm changeset status --since=origin/main

      - name: Block major version bumps (pre-1.0)
        run: |
          found=0
          for f in .changeset/*.md; do
            [ "$f" = ".changeset/README.md" ] && continue
            if grep -qP '^"@funkai/.+?":\s*major' "$f"; then
              echo "::error file=$f::Major bump detected — all @funkai/* packages are pre-1.0. Use 'minor' for breaking changes."
              found=1
            fi
          done
          exit $found
